[project]
name = "claude-code-plugins"
version = "0.1.0"
description = "Claude Code Plugins development repo"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live integration tests (network / MCP / subprocess against live config) are
# opt-in. Plain `pytest` excludes them; run them explicitly with
# `pytest -m integration` when live data is available.
addopts = "-m 'not integration'"
markers = [
  "integration: live integration tests (require network, MCP servers, or external config)",
]
