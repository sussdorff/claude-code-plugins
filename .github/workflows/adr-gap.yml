name: ADR Hoist Check

on:
  pull_request:
    paths:
      - "docs/adr/**"
      - "packages/**/contracts.yml"
      - "meta/plugins/architecture-trinity/**"

jobs:
  adr-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run meta/plugins/architecture-trinity/scripts/adr-hoist-check.py . --ci
